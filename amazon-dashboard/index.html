    <script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';
// mock-data.js
// 固定演示截止日，确保所有人打开项目时得到相同数据。
const DATA_END = '2026-11-10';
const STORES = [
  { country: '美国', name: '北美旗舰店' },
  { country: '德国', name: '欧洲生活馆' },
  { country: '英国', name: '英国家居店' },
];
const products = ['庭院遮阳伞', '金属储物棚', '户外棚架', '休闲藤椅', '餐桌组合', '折叠边桌'];
function dateBefore(date, days) {
  const value = new Date(`${date}T00:00:00Z`);
  value.setUTCDate(value.getUTCDate() - days);
  return value.toISOString().slice(0, 10);
}

function createMockRows() {
  const rows = [];
  for (let offset = 0; offset < 30; offset += 1) {
    for (let i = 0; i < 18; i += 1) {
      const productIndex = i % 6;
      const units = 12 + ((i * 17 + offset * 13) % 39);
      const revenue = units * (32 + productIndex * 18);
      const adSpend = revenue * (0.08 + (i % 5) * 0.035);
      const clicks = Math.round(adSpend / (0.7 + (i % 4) * 0.4));
      rows.push({
        date: dateBefore(DATA_END, offset),
        country: STORES[i % 3].country,
        shop: STORES[i % 3].name,
        category1: productIndex < 3 ? '户外花园' : '家居家具',
        category2: productIndex < 3 ? '庭院设施' : '休闲家具',
        category3: products[productIndex],
        sku: `DEMO-${String(i + 1).padStart(3, '0')}`,
        asin: `B0DEMO${String(i + 1).padStart(4, '0')}`,
        revenue, units, adSpend, clicks,
        impressions: clicks * (100 + i * 20),
        adRevenue: revenue * (0.3 + (i % 4) * 0.08),
        adOrders: Math.round(clicks * 0.08),
        desktopVisits: units * 4,
        mobileVisits: units * 9,
        refunds: Math.round(units * (i % 4) * 0.024),
        target: revenue * (0.85 + (i % 5) * 0.12),
      });
    }
  }
  return rows;
}

// 独立的演示日目标计划，包含本月尚未发生的日期；不生成未来销售额。
function createMockTargetPlan() {
  const end = new Date(`${DATA_END}T00:00:00Z`);
  end.setUTCMonth(end.getUTCMonth() + 1, 0);
  const start = Date.parse(`${dateBefore(DATA_END, 29)}T00:00:00Z`);
  const cutoff = Date.parse(`${DATA_END}T00:00:00Z`);
  const result = [];
  for (let time = start; time <= end.getTime(); time += 86400000) {
    const offset = (cutoff - time) / 86400000;
    for (let i = 0; i < 18; i += 1) {
      const units = 12 + (((i * 17 + offset * 13) % 39 + 39) % 39);
      result.push({date:new Date(time).toISOString().slice(0,10),sku:`DEMO-${String(i+1).padStart(3,'0')}`,shop:STORES[i%3].name,target:units*(32+(i%6)*18)*(0.85+(i%5)*0.12)});
    }
  }
  return result;
}


// core.js

const FIELDS = ['revenue', 'units', 'adSpend', 'clicks', 'impressions', 'adRevenue', 'adOrders', 'desktopVisits', 'mobileVisits', 'refunds', 'target'];
const DEFAULT_FILTERS = { days: '30', country: 'all', shop: 'all', category: 'all', category2: 'all', category3: 'all', role: 'director' };
const DEFAULT_THRESHOLDS = { 达成率: 90, ACOS: 30, 退款率: 5, CTR: 0.3, CPC: 2, 推广占比: 18, 净销售额: 500, 销量: 5, 访客: 50, 展现: 1000, 花费: 300, 点击: 10 };
const MAX_RULES = new Set(['ACOS', '退款率', 'CPC', '推广占比', '花费']);
const PERCENT_METRICS = new Set(['推广占比', '退款率', 'CTR', 'CVR', 'ACOS', '达成率']);
const MONEY_METRICS = new Set(['净销售额', '花费', 'CPC', '目标']);
const divide = (numerator, denominator, multiplier = 1) => denominator > 0 ? numerator / denominator * multiplier : null;

function aggregate(rows) {
  return rows.reduce((result, row) => {
    for (const field of FIELDS) result[field] += row[field] ?? 0;
    return result;
  }, Object.fromEntries(FIELDS.map(field => [field, 0])));
}

function metrics(row) {
  return {
    净销售额: row.revenue, 销量: row.units,
    推广占比: divide(row.adSpend, row.revenue, 100),
    退款率: divide(row.refunds, row.units, 100),
    电脑端访客: row.desktopVisits, 手机端访客: row.mobileVisits,
    访客总计: row.desktopVisits + row.mobileVisits,
    广告展现: row.impressions, 点击: row.clicks, 花费: row.adSpend,
    CTR: divide(row.clicks, row.impressions, 100),
    CVR: divide(row.adOrders, row.clicks, 100),
    CPC: divide(row.adSpend, row.clicks),
    ACOS: divide(row.adSpend, row.adRevenue, 100),
    目标: row.target, 达成率: divide(row.revenue, row.target, 100),
  };
}

function formatMetric(key, value) {
  if (!Number.isFinite(value)) return '—';
  return `${MONEY_METRICS.has(key) ? '$' : ''}${value.toLocaleString('en-US', {
    maximumFractionDigits: PERCENT_METRICS.has(key) || key === 'CPC' ? 2 : 0,
  })}${PERCENT_METRICS.has(key) ? '%' : ''}`;
}

function periodFor(filters, endDate = DATA_END) {
  if(filters.days==='custom'){
    const valid=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value+'T00:00:00Z'))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value;
    if(valid(filters.start)&&valid(filters.end)&&filters.start<=filters.end)return {start:filters.start,end:filters.end,days:Math.round((Date.parse(filters.end+'T00:00:00Z')-Date.parse(filters.start+'T00:00:00Z'))/86400000)+1};
  }
  const days = filters.days === 'month' ? Number(endDate.slice(-2)) : filters.days==='custom'?30:Number(filters.days);
  return { start: dateBefore(endDate, days - 1), end: endDate, days };
}

// 角色限制必须在数据筛选中生效，不能只依赖下拉框的禁用状态。
// 这里只提供前端角色预览；生产环境仍须由服务端鉴权。
function filterRows(rows, filters, endDate = DATA_END) {
  const period = periodFor(filters, endDate);
  return filterScopeRows(rows, filters).filter(row => row.date >= period.start && row.date <= period.end);
}
function filterScopeRows(rows, filters) {
  return rows.filter(row => (filters.role === 'director' || row.country === '美国')
    && (filters.role !== 'manager' || row.shop === '北美旗舰店')
    && (filters.country === 'all' || row.country === filters.country)
    && (filters.shop === 'all' || row.shop === filters.shop)
    && (filters.category === 'all' || row.category1 === filters.category)
    && (!filters.category2 || filters.category2 === 'all' || row.category2 === filters.category2)
    && (!filters.category3 || filters.category3 === 'all' || row.category3 === filters.category3));
}

function groupRows(rows, key) {
  const groups = new Map();
  for (const row of rows) {
    const name = row[key];
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(row);
  }
  return [...groups].map(([name, raw]) => ({ name, ...aggregate(raw), raw }));
}

function validateThresholds(input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) return null;
  const result = {};
  for (const key of Object.keys(DEFAULT_THRESHOLDS)) {
    const value = input[key];
    if (value === '' || value === null || typeof value === 'boolean' || !Number.isFinite(Number(value)) || Number(value) < 0) return null;
    result[key] = Number(value);
  }
  return result;
}

function flags(row, thresholds) {
  const values = metrics(row);
  return Object.entries(thresholds).filter(([key, threshold]) => {
    const value = values[key === '访客' ? '访客总计' : key === '展现' ? '广告展现' : key];
    if (!Number.isFinite(value)) return false;
    return MAX_RULES.has(key) ? value > threshold : value < threshold;
  }).map(([key]) => key);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function csvCell(value) {
  let text = String(value ?? '');
  // 导出维度文本时，阻止电子表格将其作为公式执行。
  if (/^[\s]*[=+\-@]/.test(text)) text = `'${text}`;
  return `"${text.replaceAll('"', '""')}"`;
}

function toCsv(rows) {
  return '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');

// storage.js

function readSetting(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function writeSetting(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}
function loadThresholds() {
  return validateThresholds(readSetting('amz-threshold', null)) ?? { ...DEFAULT_THRESHOLDS };
}

function loadFrequency() {
  const value = readSetting('amz-frequency', null);
  if (value === 'daily' || value === 'weekly') return value;
  // 保留从原单文件版本迁移过来的更新频率。
  try { return localStorage.getItem('demo-frequency') === '每周' ? 'weekly' : 'daily'; }
  catch { return 'daily'; }
}

function parseTargetCsv(text) {

    } else cell+=c;
  }

  row.push(cell.trim());if(row.some(Boolean))rows.push(row);
  return rows;

  if(!matrix.length)throw Error('CSV 没有目标数据');

  const records=[],errors=[];
  matrix.forEach((row,i)=>{
    const [shop,sku,start,end,amount]=indexes.map(j=>row[j]??'');
    const record={shop,sku,start,end,target:Number(amount)};
    if(row.length!==header.length)errors.push(`第 ${i+2} 行：列数不一致`);
    else if(!catalog.some(x=>x.shop===shop&&x.sku===sku))errors.push(`第 ${i+2} 行：店铺与 SKU 不匹配（${shop} / ${sku}）`);
    else if(!validSkuCycle(record))errors.push(`第 ${i+2} 行：日期须为 YYYY-MM-DD，结束日期不得早于开始日期`);
    else if(!/^\d+(\.\d{1,2})?$/.test(amount)||!Number.isFinite(record.target)||record.target<=0)errors.push(`第 ${i+2} 行：目标金额须为大于 0 的数字，最多两位小数`);

    else records.push(record);

  for(const r of records)if(retained.some(x=>x.shop===r.shop&&x.sku===r.sku&&x.start<=r.end&&x.end>=r.start))errors.push(`${r.sku}：与已导入周期重叠，请沿用原周期覆盖`);
  if(errors.length)throw Error(errors.slice(0,20).join('\n'));

    const r=records.find(x=>x.shop===row.shop&&x.sku===row.sku&&row.date>=x.start&&row.date<=x.end);

    const days=Math.round((Date.parse(r.end)-Date.parse(r.start))/86400000)+1;

3","text":"过去我们更多是按照 SP、SB、SD，或者关键词、ASIN、人群来区分广告。\n\n这种方式虽然可以正常投放，但存在几个问题：\n广告目标不清晰： 所有广告都希望出单、ACOS 低，但不同广告承担的任务本来就不一样。\n考核标准不合理： 泛流量广告本身承担拉新任务，如果完全按照精准广告的 ACOS 标准考核，就容易被过早关闭。\n流量结构不清晰： 不知道当前花费主要用于精准成交，还是用于拓展新客户。\n优化方向不明确： 广告表现不好时，只知道降低竞价或暂停，却不知道应该根据广告的实际任务进行调整。"}]},{"row":5,"cells":[{"ref":"A5","text":"2. A1–A5 解决什么问题？"}]},{"row":6,"cells":[{"ref":"A6","text":"我们希望把广告从单纯的“投放管理”，转变成“流量经营管理”。\n\n每个广告组在建立之前，先明确它承担什么任务，再决定如何投放、投入多少预算，以及用什么指标判断效果。\n\n最终实现三个统一：\n1. 统一广告定位： 每个广告组都知道自己负责扩流、拉新、收割还是老客经营。\n2. 统一考核标准： 不同任务使用不同的核心指标，不再简单地用同一个 ACOS 标准评价所有广告。\n3. 统一管理方法： 通过 A1–A5，可以快速了解产品广告结构、预算分配是否合理，以及下一步应该优化哪里。"}]}],"merges":[]},{"name":"A1-A5定义","rows":[{"row":1,"cells":[{"ref":"A1","text":"01｜广告组判断标准"}]},{"row":2,"cells":[{"ref":"A2","text":"流量分类"},{"ref":"B2","text":"流量类型分类"},{"ref":"C2","text":"定义"},{"ref":"D2","text":"核心任务"},{"ref":"E2","text":"主要考核"},{"ref":"F2","text":"典型投放"}]},{"row":3,"cells":[{"ref":"A3","text":"A1"},{"ref":"B3","text":"低成本扩流"},{"ref":"C3","text":"低成本获取增量点击/详情访问"},{"ref":"D3","text":"低CPC获取有效增量流量"},{"ref":"E3","text":"CPC、CTR、花费占比、点击占比"},{"ref":"F3","text":"Similar、Contextual大类目、SD部分泛人群，互补类目等"}]},{"row":4,"cells":[{"ref":"A4","text":"A2"},{"ref":"B4","text":"泛流量拉新"},{"ref":"C4","text":"覆盖相关但意向较宽泛的潜在客户"},{"ref":"D4","text":"扩大相关潜在客户覆盖，同时控制成本，争取成交。"},{"ref":"E4","text":"CPC、CTR、花费占比、点击占比"},{"ref":"F4","text":"超级流量大词、较泛类目/ASIN、vcpm本品类目、场景关联类目等"}]},{"row":5,"cells":[{"ref":"A5","text":"A3"},{"ref":"B5","text":"核心拉新"},{"ref":"C5","text":"获取核心相关流量，包括潜在新客户及品牌搜索流量"},{"ref":"D5","text":"核心流量拓展与品牌需求承接，兼顾转化"},{"ref":"E5","text":"ACOS、CVR、花费占比、点击占比"},{"ref":"F5","text":"流量大词、竞品ASIN、本品类目、同类型商品流量等"}]},{"row":6,"cells":[{"ref":"A6","text":"A4"},{"ref":"B6","text":"精准收割"},{"ref":"C6","text":"承接高购买意向或已验证可转化流量"},{"ref":"D6","text":"稳定出单，控制转化成本"},{"ref":"E6","text":"ACOS、CVR、花费占比、点击占比"},{"ref":"F6","text":"精准大词、尺寸等精准长尾词、高转化搜索词/ASIN等"}]},{"row":7,"cells":[{"ref":"A7","text":"A5"},{"ref":"B7","text":"已购PL再收割"},{"ref":"C7","text":"面向有明确PURPLE LEAF历史购买记录的受众"},{"ref":"D7"," const KNOWLEDGE_EXAMPLES = definitionSheet.rows.filter(row => row.row >= 12 && row.row <= 16).map(knowledgeRecord);
const KNOWLEDGE_AUDIENCES = audienceSheet.rows.filter(row => row.row >= 3).map(row => ({ ...knowledgeRecord(row), imageId: row.cells.find(cell => cell.imageId)?.imageId }));

function recommendationMatches(value, filter) {
  if (filter === 'all') return true;
  if (filter === 'required') return value?.startsWith('必建');
  if (filter === 'expansion') return value === '长链路扩流';
  return value?.startsWith('看需要');
}
function filterKnowledgeStrategies(filters = {}) {
  const selected = { ...DEFAULT_KNOWLEDGE_FILTERS, ...filters };
  const terms = selected.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return KNOWLEDGE_STRATEGIES.filter(row => {
    const text = KNOWLEDGE_COLUMNS.map(([key]) => row[key] ?? '').join(' ').toLowerCase();
    return terms.every(term => text.includes(term))
      && (selected.stage === 'all' || row.B === selected.stage)
      && (selected.type === 'all' || row.C === selected.type)
      && (selected.targeting === 'all' || row.F === selected.targeting)
      && recommendationMatches(row.M, selected.recommendation)
      && (selected.priority === 'all' || (selected.priority === 'unmarked' ? !row.N : row.N === selected.priority));
  });
}
function knowledgePagination(filters) {
  const result = filterKnowledgeStrategies(filters);
  const pageCount = Math.max(1, Math.ceil(result.length / KNOWLEDGE_PAGE_SIZE));
  const page = Math.min(Math.max(Number(filters.page) || 1, 1), pageCount);
  const offset = (page - 1) * KNOWLEDGE_PAGE_SIZE;
  return { result, pageCount, page, offset, rows: result.slice(offset, offset + KNOWLEDGE_PAGE_SIZE) };
}
function knowledgeSource(sheet, range = '') {
  return `<span class="knowledge-source">来源：${escapeHtml(sheet)}${range ? ` · ${escapeHtml(range)}` : ''}</span>`;
}
function knowledgeValue(value) { return value ? escapeHtml(value) : '<span class="muted">原表未填</span>'; }
function knowledgeSelect(key, label, options, filters) {
  return `<label>${label}<select data-knowledge-filter="${key}" aria-label="知识${label}">${options.map(([value, title]) => `<option value="${escapeHtml(value)}" ${filters[key] === value ? 'selected' : ''}>${escapeHtml(title)}</option>`).join('')}</select></label>`;
}

function renderKnowledgeResults(filters) {
  const { result, rows, page, pageCount, offset } = knowledgePagination(filters);
  return `<div class="knowledge-results-heading"><p id="knowledge-result-count" role="status">共 <b>${result.length}</b> 条策略${result.length ? `，显示第 ${offset + 1}–${offset + rows.length} 条` : ''}</p><button type="button" data-action="export-knowledge" ${result.length ? '' : 'disabled'}>↓ 导出筛选结果</button></div>${rows.length ? `<div class="knowledge-strategies">${rows.map(row => `<details class="knowledge-strategy"><summary><span class="knowledge-stage stage-${row.B}">${escapeHtml(row.B)}</span><div class="knowledge-strategy-title"><strong>${escapeHtml(row.J)}</strong><span>${escapeHtml(row.L || row.G || '')}</span></div><span class="knowledge-type">${escapeHtml(row.C)}${row.E ? ` · ${escapeHtml(row.E)}` : ''}</span><span class="knowledge-recommendation ${row.M?.startsWith('必建') ? 'required' : ''}">${escapeHtml(row.M || '未标注')}</span><span class="knowledge-priority">${escapeHtml(row.N || '—')}</span><span class="knowledge-expand" aria-hidden="true">＋</span></summary><div class="knowledge-strategy-body"><div class="knowledge-detail-heading"><h3>${escapeHtml(row.G || row.J)}</h3><button type="button" data-copy-strategy="${row.row}">复制广告组名</button></div><dl class="knowledge-fields">${KNOWLEDGE_COLUMNS.map(([key, label]) => `<div class="${['J', 'L', 'O'].includes(key) ? 'wide' : ''}"><dt>${label}</dt><dd>${knowledgeValue(row[key])}</dd></div>`).join('')}</dl>${knowledgeSource('群爆款列表', `A${row.row}:O${row.row}`)}</div></details>`).join('')}</div>` : '<div class="empty"><h3>没有匹配的策略</h3><p>可以减少筛选条件，或尝试其他关键词。</p><button type="button" data-action="reset-knowledge">清空筛选</button></div>'}<div class="knowledge-pagination"><span>第 ${page} / ${pageCount} 页</span><div><button type="button" data-knowledge-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>上一页</button><button type="button" data-knowledge-page="${page + 1}" ${page >= pageCount ? 'disabled' : ''}>下一页</button></div></div>`;
}

function renderKnowledgeLibrary(filters) {
  const targeting = [...new Set(KNOWLEDGE_STRATEGIES.map(row => row.F))].sort();

const fmt = formatMetric;
const esc = escapeHtml;




const PAGES = ['业绩总览', '业绩详情', '广告构成', '单品明细', 'AI基础分析', '数据源设置', '权限设置', '广告知识'];
const DETAIL_KEYS = ['净销售额', '销量', '访客总计', '花费', '广告展现', '点击', 'CTR', 'CVR', 'CPC', 'ACOS', '目标', '达成率'];
const PRODUCT_KEYS = ['净销售额', '销量', '访客总计', '退款率', '推广占比', '广告展现', '点击', '花费', 'CTR', 'CVR', 'CPC', 'ACOS', '目标', '达成率'];
const AD_TYPES = [
  { name: 'SP', label: '商品推广', share: 0.58, color: '#367db1' },
  { name: 'SB', label: '品牌推广', share: 0.18, color: '#eea039' },
  { name: 'SD', label: '展示型推广', share: 0.14, color: '#54a4a5' },
  { name: 'SBV', label: '品牌视频广告', share: 0.1, color: '#919bb6' },
];
function dimensionKey(state) {
  return state.dimension === '国家' ? 'country' : state.dimension === '店铺' ? 'shop' : `category${state.level}`;
}
function matchingProducts(rows, query) {
  const needle = query.trim().toLowerCase();
  return groupRows(rows, 'sku').filter(row => `${row.name} ${row.raw[0].asin} ${row.raw[0].category3}`.toLowerCase().includes(needle));
}
function table(rows, keys, thresholds, detail = false) {
  return `<div class="scroll" tabindex="0" aria-label="可横向滚动的数据表"><table><thead><tr><th scope="col">维度 / 产品</th>${keys.map(key => `<th scope="col">${esc(key)}</th>`).join('')}${detail ? '<th scope="col">异常判断</th>' : ''}</tr></thead><tbody>${rows.length ? rows.map(row => {
    const values = metrics(row);
    const problems = detail ? flags(row, thresholds) : [];
    return `<tr><th scope="row">${esc(row.name)}${detail ? `<small>${esc(row.raw[0].category3)}<br>${esc(row.raw[0].asin)} · ${esc(row.raw[0].shop)}</small>` : ''}</th>${keys.map(key => `<td>${fmt(key, values[key])}</td>`).join('')}${detail ? `<td class="flag-cell">${problems.length ? problems.map(key => `<span class="tag red">${esc(key)}</span>`).join('') : '<span class="tag green">正常</span>'}</td>` : ''}</tr>`;
  }).join('') : `<tr><td colspan="${keys.length + (detail ? 2 : 1)}" class="empty">没有匹配的产品，请调整搜索条件。</td></tr>`}</tbody></table></div>`;
}

function trend(rows, period) {
  const totals = new Map(groupRows(rows, 'date').map(row => [row.name, row.revenue]));
  const values = Array.from({ length: period.days }, (_, index) => {
    const date = dateBefore(period.end, period.days - 1 - index);
    return { date, value: totals.get(date) ?? 0 };
  });
  const max = Math.max(...values.map(row => row.value), 1);
  const points = values.map((row, index) => `${60 + index * 620 / Math.max(values.length - 1, 1)},${180 - row.value / max * 145}`);
  return `<svg class="trend" viewBox="0 0 710 220" role="img" aria-label="${esc(period.start)} 至 ${esc(period.end)} 的每日净销售额趋势"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#367db1" stop-opacity="0.2"/><stop offset="100%" stop-color="#367db1" stop-opacity="0"/></linearGradient></defs>${[0, 0.5, 1].map(ratio => `<line x1="60" y1="${180 - ratio * 145}" x2="680" y2="${180 - ratio * 145}" stroke="#e7edf4"/><text x="48" y="${184 - ratio * 145}" text-anchor="end">${Math.round(max * ratio / 1000)}k</text>`).join('')}<polygon points="60,180 ${points.join(' ')} 680,180" fill="url(#chart-fill)"/><polyline fill="none" stroke="#367db1" stroke-width="3" stroke-linejoin="round" points="${points.join(' ')}"/>${values.map((row, index) => `<circle cx="${60 + index * 620 / Math.max(values.length - 1, 1)}" cy="${180 - row.value / max * 145}" r="3" fill="#367db1"><title>${row.date}：${fmt('净销售额', row.value)}</title></circle>`).join('')}<text x="60" y="210">${period.start.slice(5)}</text><text x="680" y="210" text-anchor="end">${period.end.slice(5)}</text></svg>`;
}

function overview(rows, period) {
  const total = aggregate(rows);
  const values = metrics(total);
  const cards = Object.entries(values).filter(([key]) => !['达成率', '目标', '电脑端访客', '手机端访客'].includes(key));
  return `<div class="cards">${cards.map(([key, value], index) => `<section class="card ${index === 0 ? 'featured' : ''}"><span class="metric-label">${esc(key)}</span><strong>${fmt(key, value)}</strong><small>所选期间 · 模拟数据</small></section>`).join('')}</div><div class="split"><section class="panel"><div class="panel-heading"><h2>净销售额趋势</h2><span class="muted">USD · 按日</span></div>${trend(rows, period)}<p class="muted">按日期从早到晚展示；悬停数据点查看当日销售额。</p><details><summary>查看每日销售数据</summary>${table(groupRows(rows, 'date').sort((a, b) => a.name.localeCompare(b.name)), ['净销售额', '销量'])}</details></section><section class="panel goal"><h2>经营目标进度</h2>${targetImportControls()}<strong class="goal-value">${fmt('达成率', values.达成率)}</strong><div class="bar" role="img" aria-label="目标达成率 ${fmt('达成率', values.达成率)}"><i style="width:${Math.min(values.达成率 ?? 0, 100)}%"></i></div><p>期间目标 <b>${fmt('目标', total.target)}</b></p><p class="muted">实际净销售额 / 所选期间经营目标；导入周期目标按天分配后汇总</p><button class="primary" data-action="diagnose">查看异常诊断 →</button></section></div>`;
}

  return `<section class="panel"><div class="panel-heading"><h2>业绩维度分析</h2></div>${table(groupRows(rows, 'country'), DETAIL_KEYS)}</section>`;
}

function ads(rows) {
  const total = aggregate(rows);
  return `<section class="panel"><div class="panel-heading"><h2>广告投入结构</h2><strong>${fmt('花费', total.adSpend)}</strong></div><p class="muted">按固定模拟比例拆分，各类型花费之和与总览一致。</p><div class="ad-stack" role="img" aria-label="SP 58%，SB 18%，SD 14%，SBV 10%">${AD_TYPES.map(type => `<span style="width:${type.share * 100}%;background:${type.color}">${type.name}</span>`).join('')}</div>${AD_TYPES.map(type => `<div class="ad-row"><div><b>${type.name}</b><small>${type.label}</small></div><div class="bar"><i style="width:${type.share * 100}%;background:${type.color}"></i></div><strong>${fmt('花费', total.adSpend * type.share)}</strong><span class="muted">${Math.round(type.share * 100)}%</span></div>`).join('')}</section>`;

function analysis(rows, state) {
  const groups = groupRows(rows, 'sku');
  const bad = groups.filter(row => flags(row, state.thresholds).length);
  return `<section class="panel"><h2>诊断标准 · 可配置</h2><p class="muted">按当前筛选期间的累计值判断。金额单位 USD，比例单位 %；规则边界值本身视为达标。</p><form id="threshold-form"><div class="threshold-grid">${Object.entries(state.thresholds).map(([key, value]) => `<label>${esc(key)}<span class="muted">${MAX_RULES.has(key) ? '最高值' : '最低值'}</span><input name="${esc(key)}" type="number" min="0" step="any" required value="${value}"></label>`).join('')}</div><div class="form-actions"><button type="submit" class="primary">应用标准并生成诊断</button><button type="button" data-action="reset-thresholds">恢复默认标准</button></div></form></section><section class="panel"><div class="panel-heading"><h2>基础诊断摘要</h2><span class="tag red">${bad.length} 个产品触发规则</span></div><div class="note">发现 ${bad.length} / ${groups.length} 个产品触发规则。摘要由本地规则生成，原因需人工核实，不调用外部 AI。</div><div class="category-summary">${groupRows(rows, `category${state.level}`).map(row => `<p><b>${esc(row.name)}</b><span>${esc(flags(row, state.thresholds).join('、') || '全部达标')}</span></p>`).join('')}</div>${bad.length ? bad.map(row => `<article class="diagnosis"><div class="panel-heading"><h3>${esc(row.name)} <span class="muted">${esc(row.raw[0].category3)}</span></h3><span class="muted">${esc(row.raw[0].shop)}</span></div><p class="red">触发：${esc(flags(row, state.thresholds).join('、'))}</p><p>期间净销售额 ${fmt('净销售额', row.revenue)}，目标达成 ${fmt('达成率', metrics(row).达成率)}，ACOS ${fmt('ACOS', metrics(row).ACOS)}。</p><p class="muted">建议：核对预算和搜索词质量，检查价格、评价与商品页面转化；核实数据与归因后再调整投放。</p></article>`).join('') : '<div class="empty green">当前筛选范围内的产品均未触发已配置规则。</div>'}</section><div class="note">报告更新预览：每周一 09:00（北京时间）。此项目没有后台调度，报告随筛选和标准即时重算。</div>`;
}

targetDialog.addEventListener('click',event=>{
  if(event.target.closest('[data-target-close]')){targetReadVersion++;targetDialog.close();}
  if(event.target.closest('[data-target-reset]')){if(!writeSetting('amz-target-import-v1',[])){toast('无法保存，清除未应用');return;}targetRecords=[];pendingTargets=null;targetReadVersion++;targetDialog.close();render();toast('已清除 CSV 目标，恢复默认日目标计划；单 SKU 手动规则保留');return;}
  if(event.target.closest('[data-target-template]'))downloadTargetTemplate();
  if(event.target.id==='target-import-confirm'&&pendingTargets){
    const nextRules={...state.skuRules};
    for(const r of pendingTargets.records){const key=skuRuleKey(r.shop,r.sku,r);if(nextRules[key])nextRules[key]={...nextRules[key],target:r.target};}
    if(!writeSetting('amz-target-import-v1',pendingTargets.merged)){toast('浏览器无法保存目标，导入未应用');return;}
    targetRecords=pendingTargets.merged;state.skuRules=nextRules;persistSkuSettings();
    const cycles=new Set(pendingTargets.records.map(r=>r.start+'|'+r.end));
    if(state.page===3&&cycles.size===1){const r=pendingTargets.records[0];state.skuCycle={start:r.start,end:r.end};persistSkuSettings();}
    const count=pendingTargets.records.length;targetDialog.close();render();toast(`已导入 ${count} 条目标，两个看板已更新`);
  }
});
let targetReadVersion=0;
targetDialog.addEventListener('change',async event=>{
  if(event.target.id!=='target-csv-file')return;
  const version=++targetReadVersion,file=event.target.files[0];pendingTargets=null;
  const preview=targetDialog.querySelector('#target-import-preview'),confirm=targetDialog.querySelector('#target-import-confirm');confirm.disabled=true;preview.textContent='正在检查 CSV…';
  try{
    if(!file)throw Error('请选择 CSV 文件');if(file.size>5*1024*1024)throw Error('CSV 文件不能超过 5 MB');
    const buffer=await file.arrayBuffer();let text;try{text=new TextDecoder('utf-8',{fatal:true}).decode(buffer);}catch{text=new TextDecoder('gb18030',{fatal:true}).decode(buffer);}
    const result=validateTargetCsv(text,rows,targetRecords);if(version!==targetReadVersion)return;
    pendingTargets=result;
    preview.innerHTML=`<p class="green">检查通过：${result.records.length} 条目标，覆盖 ${result.replaced} 条已有导入目标。确认后生效。</p><p class="muted">${state.page===3?'若所有记录周期一致，将自动切换至该预警周期。':'业绩总览按顶部时间范围汇总目标；请确认日期范围。'}</p><div class="scroll"><table><thead><tr><th>店铺 / SKU</th><th>周期</th><th>目标 USD</th></tr></thead><tbody>${result.records.slice(0,20).map(r=>`<tr><th>${escapeHtml(r.shop)} / ${escapeHtml(r.sku)}</th><td>${r.start} — ${r.end}</td><td>${r.target.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>${result.records.length>20?'<p>预览前 20 条，确认将导入全部记录。</p>':''}`;confirm.disabled=false;
  }catch(error){if(version!==targetReadVersion)return;preview.textContent=error.message;preview.style.whiteSpace='pre-wrap';}
});

});
</script>

  <body>
    <a class="skip-link" href="#content">跳到看板内容</a>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div>AMAZON<small>经营驾驶舱</small></div></div>
      <p class="sidebar-caption">团队销售分析 · DEMO V1</p>
      <nav id="nav" aria-label="主要导航"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span> 演示环境<small>数据截止 2026.11.10</small></div>
    </aside>
    <main>
      <header class="top">
        <div><p class="breadcrumb">团队经营 / <span id="crumb">业绩总览</span></p><h1 id="title">业绩总览</h1><p class="subtitle" id="period"></p></div>
        <div class="top-actions"><span class="badge" id="data-badge">● 虚构模拟数据</span><button id="export" type="button">↓ 导出 CSV</button></div>
      </header>
      <section class="filters" id="sales-filters" aria-label="数据筛选">
        <label>时间<select id="days"><option value="7">最近7天</option><option value="30" selected>最近30天</option><option value="month">本月累计</option><option value="custom">自定义日期</option></select></label>
        <label>国家<select id="country"></select></label>
        <label>店铺<select id="shop"></select></label>
        <label>一级品类<select id="category"><option value="all">全部一级品类</option></select></label><label>二级品类<select id="category2"><option value="all">全部二级品类</option></select></label><label>三级品类<select id="category3"><option value="all">全部三级品类</option></select></label>
        <button id="reset-filters" class="text-button" type="button">重置筛选</button>
        <form id="custom-date-form" class="custom-date-form" hidden><label>开始日期<input id="custom-start" type="date" required></label><label>结束日期<input id="custom-end" type="date" required></label><button type="submit">应用日期</button><span id="custom-date-error" role="alert" hidden>结束日期不能早于开始日期。</span></form>
      </section>
      <div id="content"></div>
      <footer class="footnote" id="sales-footnote">统一折算 USD；推广占比 = 广告花费 / 净销售额；ACOS = 花费 / 广告归因销售额。访客为设备访次加总，非跨设备去重人数。广告统一模拟 7 日归因。</footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>请启用 JavaScript 后使用此看板。</noscript>
  </body>
