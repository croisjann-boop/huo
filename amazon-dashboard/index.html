    <script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';
// mock-data.js
// 固定演示截止日，确保所有人打开项目时得到相同数据。
const DATA_END = '2026-11-10';
const STORES = [
  { country: '美国', name: '北美旗舰店' },
  { country: '德国', name: '欧洲生活馆' },
  { country: '英国', name: '英国家居店' },
];
const products = ['庭院遮阳伞', '金属储物棚', '户外棚架', '休闲藤椅', '餐桌组合', '折叠边桌'];
function dateBefore(date, days) {
  const value = new Date(`${date}T00:00:00Z`);
  value.setUTCDate(value.getUTCDate() - days);
  return value.toISOString().slice(0, 10);
}

function createMockRows() {
  const rows = [];
  for (let offset = 0; offset < 30; offset += 1) {
    for (let i = 0; i < 18; i += 1) {
      const productIndex = i % 6;
      const units = 12 + ((i * 17 + offset * 13) % 39);
      const revenue = units * (32 + productIndex * 18);
      const adSpend = revenue * (0.08 + (i % 5) * 0.035);
      const clicks = Math.round(adSpend / (0.7 + (i % 4) * 0.4));
      rows.push({
        date: dateBefore(DATA_END, offset),
        country: STORES[i % 3].country,
        shop: STORES[i % 3].name,
        category1: productIndex < 3 ? '户外花园' : '家居家具',
        category2: productIndex < 3 ? '庭院设施' : '休闲家具',
        category3: products[productIndex],
        sku: `DEMO-${String(i + 1).padStart(3, '0')}`,
        asin: `B0DEMO${String(i + 1).padStart(4, '0')}`,
        revenue, units, adSpend, clicks,
        impressions: clicks * (100 + i * 20),
        adRevenue: revenue * (0.3 + (i % 4) * 0.08),
        adOrders: Math.round(clicks * 0.08),
        desktopVisits: units * 4,
        mobileVisits: units * 9,
        refunds: Math.round(units * (i % 4) * 0.024),
        target: revenue * (0.85 + (i % 5) * 0.12),
      });
    }
  }
  return rows;
}


// core.js

const FIELDS = ['revenue', 'units', 'adSpend', 'clicks', 'impressions', 'adRevenue', 'adOrders', 'desktopVisits', 'mobileVisits', 'refunds', 'target'];
const DEFAULT_FILTERS = { days: '30', country: 'all', shop: 'all', category: 'all', role: 'director' };
const DEFAULT_THRESHOLDS = { 达成率: 90, ACOS: 30, 退款率: 5, CTR: 0.3, CPC: 2, 推广占比: 18, 净销售额: 500, 销量: 5, 访客: 50, 展现: 1000, 花费: 300, 点击: 10 };
const MAX_RULES = new Set(['ACOS', '退款率', 'CPC', '推广占比', '花费']);
const PERCENT_METRICS = new Set(['推广占比', '退款率', 'CTR', 'CVR', 'ACOS', '达成率']);
const MONEY_METRICS = new Set(['净销售额', '花费', 'CPC', '目标']);
const divide = (numerator, denominator, multiplier = 1) => denominator > 0 ? numerator / denominator * multiplier : null;

function aggregate(rows) {
  return rows.reduce((result, row) => {
    for (const field of FIELDS) result[field] += row[field] ?? 0;
    return result;
  }, Object.fromEntries(FIELDS.map(field => [field, 0])));
}

function metrics(row) {
  return {
    净销售额: row.revenue, 销量: row.units,
    推广占比: divide(row.adSpend, row.revenue, 100),
    退款率: divide(row.refunds, row.units, 100),
    电脑端访客: row.desktopVisits, 手机端访客: row.mobileVisits,
    访客总计: row.desktopVisits + row.mobileVisits,
    广告展现: row.impressions, 点击: row.clicks, 花费: row.adSpend,
    CTR: divide(row.clicks, row.impressions, 100),
    CVR: divide(row.adOrders, row.clicks, 100),
    CPC: divide(row.adSpend, row.clicks),
    ACOS: divide(row.adSpend, row.adRevenue, 100),
    目标: row.target, 达成率: divide(row.revenue, row.target, 100),
  };
}

function formatMetric(key, value) {
  if (!Number.isFinite(value)) return '—';
  return `${MONEY_METRICS.has(key) ? '$' : ''}${value.toLocaleString('en-US', {
    maximumFractionDigits: PERCENT_METRICS.has(key) || key === 'CPC' ? 2 : 0,
  })}${PERCENT_METRICS.has(key) ? '%' : ''}`;
}

function periodFor(filters, endDate = DATA_END) {
  const days = filters.days === 'month' ? Number(endDate.slice(-2)) : Number(filters.days);
  return { start: dateBefore(endDate, days - 1), end: endDate, days };
}

// 角色限制必须在数据筛选中生效，不能只依赖下拉框的禁用状态。
// 这里只提供前端角色预览；生产环境仍须由服务端鉴权。
function filterRows(rows, filters, endDate = DATA_END) {
  const period = periodFor(filters, endDate);
  return rows.filter(row => row.date >= period.start && row.date <= period.end
    && (filters.role === 'director' || row.country === '美国')
    && (filters.role !== 'manager' || row.shop === '北美旗舰店')
    && (filters.country === 'all' || row.country === filters.country)
    && (filters.shop === 'all' || row.shop === filters.shop)
    && (filters.category === 'all' || row.category1 === filters.category));
}

function groupRows(rows, key) {
  const groups = new Map();
  for (const row of rows) {
    const name = row[key];
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(row);
  }
  return [...groups].map(([name, raw]) => ({ name, ...aggregate(raw), raw }));
}

function validateThresholds(input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) return null;
  const result = {};
  for (const key of Object.keys(DEFAULT_THRESHOLDS)) {
    const value = input[key];
    if (value === '' || value === null || typeof value === 'boolean' || !Number.isFinite(Number(value)) || Number(value) < 0) return null;
    result[key] = Number(value);
  }
  return result;
}

function flags(row, thresholds) {
  const values = metrics(row);
  return Object.entries(thresholds).filter(([key, threshold]) => {
    const value = values[key === '访客' ? '访客总计' : key === '展现' ? '广告展现' : key];
    if (!Number.isFinite(value)) return false;
    return MAX_RULES.has(key) ? value > threshold : value < threshold;
  }).map(([key]) => key);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function csvCell(value) {
  let text = String(value ?? '');
  // 导出维度文本时，阻止电子表格将其作为公式执行。
  if (/^[\s]*[=+\-@]/.test(text)) text = `'${text}`;
  return `"${text.replaceAll('"', '""')}"`;
}

function toCsv(rows) {
  return '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
}


// storage.js

function readSetting(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch { return fallback; }
}
function writeSetting(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}
function loadThresholds() {
  return validateThresholds(readSetting('amz-threshold', null)) ?? { ...DEFAULT_THRESHOLDS };
}

function loadFrequency() {
  const value = readSetting('amz-frequency', null);
  if (value === 'daily' || value === 'weekly') return value;
  // 保留从原单文件版本迁移过来的更新频率。
  try { return localStorage.getItem('demo-frequency') === '每周' ? 'weekly' : 'daily'; }
  catch { return 'daily'; }
}


// views.js
const fmt = formatMetric;
const esc = escapeHtml;

const PAGES = ['业绩总览', '业绩详情', '广告构成', '单品明细', 'AI基础分析', '数据源设置', '权限设置'];
const DETAIL_KEYS = ['净销售额', '销量', '访客总计', '花费', '广告展现', '点击', 'CTR', 'CVR', 'CPC', 'ACOS', '目标', '达成率'];
const PRODUCT_KEYS = ['净销售额', '销量', '访客总计', '退款率', '推广占比', '广告展现', '点击', '花费', 'CTR', 'CVR', 'CPC', 'ACOS', '目标', '达成率'];
const AD_TYPES = [
  { name: 'SP', label: '商品推广', share: 0.58, color: '#367db1' },
  { name: 'SB', label: '品牌推广', share: 0.18, color: '#eea039' },
  { name: 'SD', label: '展示型推广', share: 0.14, color: '#54a4a5' },
  { name: 'SBV', label: '品牌视频广告', share: 0.1, color: '#919bb6' },
];
function dimensionKey(state) {
  return state.dimension === '国家' ? 'country' : state.dimension === '店铺' ? 'shop' : `category${state.level}`;
}
function matchingProducts(rows, query) {
  const needle = query.trim().toLowerCase();
  return groupRows(rows, 'sku').filter(row => `${row.name} ${row.raw[0].asin} ${row.raw[0].category3}`.toLowerCase().includes(needle));
}
function table(rows, keys, thresholds, detail = false) {
  return `<div class="scroll" tabindex="0" aria-label="可横向滚动的数据表"><table><thead><tr><th scope="col">维度 / 产品</th>${keys.map(key => `<th scope="col">${esc(key)}</th>`).join('')}${detail ? '<th scope="col">异常判断</th>' : ''}</tr></thead><tbody>${rows.length ? rows.map(row => {
    const values = metrics(row);
    const problems = detail ? flags(row, thresholds) : [];
    return `<tr><th scope="row">${esc(row.name)}${detail ? `<small>${esc(row.raw[0].category3)}<br>${esc(row.raw[0].asin)} · ${esc(row.raw[0].shop)}</small>` : ''}</th>${keys.map(key => `<td>${fmt(key, values[key])}</td>`).join('')}${detail ? `<td class="flag-cell">${problems.length ? problems.map(key => `<span class="tag red">${esc(key)}</span>`).join('') : '<span class="tag green">正常</span>'}</td>` : ''}</tr>`;
  }).join('') : `<tr><td colspan="${keys.length + (detail ? 2 : 1)}" class="empty">没有匹配的产品，请调整搜索条件。</td></tr>`}</tbody></table></div>`;
}

function trend(rows, period) {
  const totals = new Map(groupRows(rows, 'date').map(row => [row.name, row.revenue]));
  const values = Array.from({ length: period.days }, (_, index) => {
    const date = dateBefore(period.end, period.days - 1 - index);
    return { date, value: totals.get(date) ?? 0 };
  });
  const max = Math.max(...values.map(row => row.value), 1);
  const points = values.map((row, index) => `${60 + index * 620 / Math.max(values.length - 1, 1)},${180 - row.value / max * 145}`);
  return `<svg class="trend" viewBox="0 0 710 220" role="img" aria-label="${esc(period.start)} 至 ${esc(period.end)} 的每日净销售额趋势"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#367db1" stop-opacity="0.2"/><stop offset="100%" stop-color="#367db1" stop-opacity="0"/></linearGradient></defs>${[0, 0.5, 1].map(ratio => `<line x1="60" y1="${180 - ratio * 145}" x2="680" y2="${180 - ratio * 145}" stroke="#e7edf4"/><text x="48" y="${184 - ratio * 145}" text-anchor="end">${Math.round(max * ratio / 1000)}k</text>`).join('')}<polygon points="60,180 ${points.join(' ')} 680,180" fill="url(#chart-fill)"/><polyline fill="none" stroke="#367db1" stroke-width="3" stroke-linejoin="round" points="${points.join(' ')}"/>${values.map((row, index) => `<circle cx="${60 + index * 620 / Math.max(values.length - 1, 1)}" cy="${180 - row.value / max * 145}" r="3" fill="#367db1"><title>${row.date}：${fmt('净销售额', row.value)}</title></circle>`).join('')}<text x="60" y="210">${period.start.slice(5)}</text><text x="680" y="210" text-anchor="end">${period.end.slice(5)}</text></svg>`;
}

function overview(rows, period) {
  const total = aggregate(rows);
  const values = metrics(total);
  const cards = Object.entries(values).filter(([key]) => !['达成率', '目标'].includes(key));
  return `<div class="cards">${cards.map(([key, value], index) => `<section class="card ${index === 0 ? 'featured' : ''}"><span class="metric-label">${esc(key)}</span><strong>${fmt(key, value)}</strong><small>所选期间 · 模拟数据</small></section>`).join('')}</div><div class="split"><section class="panel"><div class="panel-heading"><h2>净销售额趋势</h2><span class="muted">USD · 按日</span></div>${trend(rows, period)}<p class="muted">按日期从早到晚展示；悬停数据点查看当日销售额。</p><details><summary>查看每日销售数据</summary>${table(groupRows(rows, 'date').sort((a, b) => a.name.localeCompare(b.name)), ['净销售额', '销量'])}</details></section><section class="panel goal"><h2>经营目标进度</h2><strong class="goal-value">${fmt('达成率', values.达成率)}</strong><div class="bar" role="img" aria-label="目标达成率 ${fmt('达成率', values.达成率)}"><i style="width:${Math.min(values.达成率 ?? 0, 100)}%"></i></div><p>期间目标 <b>${fmt('目标', total.target)}</b></p><p class="muted">实际净销售额 / 所选期间经营目标</p><button class="primary" data-action="diagnose">查看异常诊断 →</button></section></div>`;
}

function details(rows, state) {
  return `<section class="panel"><div class="panel-heading wrap"><h2>业绩维度分析</h2><div class="inline-controls"><div class="segmented" aria-label="统计维度">${['国家', '店铺', '品类'].map(value => `<button data-dimension="${value}" aria-pressed="${state.dimension === value}" class="${state.dimension === value ? 'selected' : ''}">${value}</button>`).join('')}</div><label>分类层级<select id="level">${[1, 2, 3].map(value => `<option value="${value}" ${state.level === value ? 'selected' : ''}>${value}级分类</option>`).join('')}</select></label></div></div>${table(groupRows(rows, dimensionKey(state)), DETAIL_KEYS)}</section>`;
}

function ads(rows) {
  const total = aggregate(rows);
  return `<section class="panel"><div class="panel-heading"><h2>广告投入结构</h2><strong>${fmt('花费', total.adSpend)}</strong></div><p class="muted">按固定模拟比例拆分，各类型花费之和与总览一致。</p><div class="ad-stack" role="img" aria-label="SP 58%，SB 18%，SD 14%，SBV 10%">${AD_TYPES.map(type => `<span style="width:${type.share * 100}%;background:${type.color}">${type.name}</span>`).join('')}</div>${AD_TYPES.map(type => `<div class="ad-row"><div><b>${type.name}</b><small>${type.label}</small></div><div class="bar"><i style="width:${type.share * 100}%;background:${type.color}"></i></div><strong>${fmt('花费', total.adSpend * type.share)}</strong><span class="muted">${Math.round(type.share * 100)}%</span></div>`).join('')}</section>`;
}

function analysis(rows, state) {
  const groups = groupRows(rows, 'sku');
  const bad = groups.filter(row => flags(row, state.thresholds).length);
  return `<section class="panel"><h2>诊断标准 · 可配置</h2><p class="muted">按当前筛选期间的累计值判断。金额单位 USD，比例单位 %；规则边界值本身视为达标。</p><form id="threshold-form"><div class="threshold-grid">${Object.entries(state.thresholds).map(([key, value]) => `<label>${esc(key)}<span class="muted">${MAX_RULES.has(key) ? '最高值' : '最低值'}</span><input name="${esc(key)}" type="number" min="0" step="any" required value="${value}"></label>`).join('')}</div><div class="form-actions"><button type="submit" class="primary">应用标准并生成诊断</button><button type="button" data-action="reset-thresholds">恢复默认标准</button></div></form></section><section class="panel"><div class="panel-heading"><h2>基础诊断摘要</h2><span class="tag red">${bad.length} 个产品触发规则</span></div><div class="note">发现 ${bad.length} / ${groups.length} 个产品触发规则。摘要由本地规则生成，原因需人工核实，不调用外部 AI。</div><div class="category-summary">${groupRows(rows, `category${state.level}`).map(row => `<p><b>${esc(row.name)}</b><span>${esc(flags(row, state.thresholds).join('、') || '全部达标')}</span></p>`).join('')}</div>${bad.length ? bad.map(row => `<article class="diagnosis"><div class="panel-heading"><h3>${esc(row.name)} <span class="muted">${esc(row.raw[0].category3)}</span></h3><span class="muted">${esc(row.raw[0].shop)}</span></div><p class="red">触发：${esc(flags(row, state.thresholds).join('、'))}</p><p>期间净销售额 ${fmt('净销售额', row.revenue)}，目标达成 ${fmt('达成率', metrics(row).达成率)}，ACOS ${fmt('ACOS', metrics(row).ACOS)}。</p><p class="muted">建议：核对预算和搜索词质量，检查价格、评价与商品页面转化；核实数据与归因后再调整投放。</p></article>`).join('') : '<div class="empty green">当前筛选范围内的产品均未触发已配置规则。</div>'}</section><div class="note">报告更新预览：每周一 09:00（北京时间）。此项目没有后台调度，报告随筛选和标准即时重算。</div>`;
}

function sources(state) {
  return `<section class="panel"><h2>数据源设置</h2><div class="note">当前使用内置虚构数据。尚未连接真实亚马逊账户，也不会收集密钥。</div><div class="source-grid">${['销售与退款报表', '访客与流量报表', '广告报表', '经营目标'].map((name, index) => `<article class="source-card"><span class="source-icon">0${index + 1}</span><h3>${name}</h3><span class="green">● 内置模拟数据已就绪</span></article>`).join('')}</div><form id="frequency-form"><div class="inline-controls"><label>展示更新频率<select name="frequency"><option value="daily" ${state.frequency === 'daily' ? 'selected' : ''}>每日</option><option value="weekly" ${state.frequency === 'weekly' ? 'selected' : ''}>每周</option></select></label><button type="submit">保存演示设置</button></div><p class="muted">此设置仅保存在当前浏览器，不会触发实际同步。</p></form></section>`;
}

function permissions() {
  return `<section class="panel"><h2>权限设置 · 角色预览</h2><div class="note">顶部“查看身份”只用于前端角色演示，不能代替真实身份认证和服务端访问控制。</div><div class="scroll"><table><thead><tr><th scope="col">角色</th><th scope="col">数据范围</th><th scope="col">能力预览</th></tr></thead><tbody><tr><th scope="row">总监</th><td>全部国家与店铺</td><td>经营查看、规则配置</td></tr><tr><th scope="row">副总监</th><td>美国业务</td><td>所辖业务分析、规则配置预览</td></tr><tr><th scope="row">店长</th><td>北美旗舰店</td><td>所辖单品查看、规则配置预览</td></tr></tbody></table></div><p class="muted">演示仅限制数据展示范围，各角色均可试用配置页面。真实授权需要在后端实现。</p></section>`;
}

function renderPage(rows, state, period) {
  if (!rows.length && state.page < 5) return '<section class="panel empty"><h2>当前筛选没有数据</h2><p>请调整国家、店铺或品类后重试。</p><button data-action="reset-filters">重置筛选</button></section>';
  switch (state.page) {
    case 0: return overview(rows, period);
    case 1: return details(rows, state);
    case 2: return ads(rows);
    case 3: return `<section class="panel"><div class="panel-heading wrap"><h2>SKU / ASIN 异常监控</h2><label class="search-label">搜索<input id="search" type="search" placeholder="SKU、ASIN 或商品名" value="${esc(state.query)}" autocomplete="off"></label></div><p class="muted">${groupRows(rows, 'sku').length} 个产品 · 按当前筛选期间累计，异常沿用诊断标准</p><div id="products">${table(matchingProducts(rows, state.query), PRODUCT_KEYS, state.thresholds, true)}</div></section>`;
    case 4: return analysis(rows, state);
    case 5: return sources(state);
    case 6: return permissions();
    default: return overview(rows, period);
  }
}


// main.js




const $ = id => document.getElementById(id);
const rows = createMockRows();
const state = { page: 0, dimension: '国家', level: 1, query: '', filters: { ...DEFAULT_FILTERS }, thresholds: loadThresholds(), frequency: loadFrequency() };
let toastTimer;
function toast(message) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  $('toast').hidden = false;
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
}
function refreshFilters() {
  const filter = state.filters;
  if (filter.role !== 'director') filter.country = '美国';
  if (filter.role === 'manager') filter.shop = '北美旗舰店';
  const stores = STORES.filter(store => filter.country === 'all' || store.country === filter.country);
  if (filter.shop !== 'all' && !stores.some(store => store.name === filter.shop)) filter.shop = 'all';
  $('country').replaceChildren(...[{ value: 'all', label: '全部国家' }, ...STORES.map(store => ({ value: store.country, label: store.country }))].map(item => new Option(item.label, item.value)));
  $('shop').replaceChildren(new Option('全部店铺', 'all'), ...stores.map(store => new Option(store.name, store.name)));
  for (const key of Object.keys(DEFAULT_FILTERS)) $(key).value = filter[key];
  $('country').disabled = filter.role !== 'director';
  $('shop').disabled = filter.role === 'manager';
}
function render() {
  refreshFilters();
  const filtered = filterRows(rows, state.filters);
  const period = periodFor(state.filters);
  $('title').textContent = PAGES[state.page];
  $('crumb').textContent = PAGES[state.page];
  $('period').textContent = `${period.start} — ${period.end} · ${period.days} 天 · USD`;
  $('nav').innerHTML = PAGES.map((page, index) => `<button type="button" data-page="${index}" ${state.page === index ? 'class="active" aria-current="page"' : ''}><span class="nav-index">0${index + 1}</span>${page}</button>`).join('');
  $('content').innerHTML = renderPage(filtered, state, period);
  $('export').hidden = state.page > 4;
  $('export').disabled = !filtered.length;
}
function resetFilters() {
  // 保留当前预览角色；重置不会扩大店长或副总监的数据范围。
  state.filters = { ...DEFAULT_FILTERS, role: state.filters.role };
  state.query = '';
  render();
}
for (const key of Object.keys(DEFAULT_FILTERS)) {
  $(key).addEventListener('change', event => {
    state.filters[key] = event.target.value;
    if (key === 'role') {
      state.filters.country = state.filters.role === 'director' ? 'all' : '美国';
      state.filters.shop = state.filters.role === 'manager' ? '北美旗舰店' : 'all';
    }
    render();
  });
}
$('reset-filters').addEventListener('click', resetFilters);
$('nav').addEventListener('click', event => {
  const button = event.target.closest('[data-page]');
  if (!button) return;
  state.page = Number(button.dataset.page);
  render();
  $('title').setAttribute('tabindex', '-1');
  $('title').focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: 'instant' });
});
$('content').addEventListener('click', event => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'diagnose') { state.page = 4; render(); }
  if (action === 'reset-filters') resetFilters();
  if (action === 'reset-thresholds') {
    state.thresholds = { ...DEFAULT_THRESHOLDS };
    const saved = writeSetting('amz-threshold', state.thresholds);
    render();
    toast(saved ? '已恢复并保存默认标准' : '已恢复默认标准；浏览器不允许保存，仅本次有效');
  }
  const dimension = event.target.closest('[data-dimension]')?.dataset.dimension;
  if (dimension) { state.dimension = dimension; render(); }
});
$('content').addEventListener('change', event => {
  if (event.target.id === 'level') { state.level = Number(event.target.value); render(); }
});
$('content').addEventListener('input', event => {
  if (event.target.id !== 'search') return;
  state.query = event.target.value;
  $('products').innerHTML = table(matchingProducts(filterRows(rows, state.filters), state.query), PRODUCT_KEYS, state.thresholds, true);
});
$('content').addEventListener('submit', event => {
  event.preventDefault();
  if (event.target.id === 'threshold-form') {
    const values = validateThresholds(Object.fromEntries(new FormData(event.target)));
    if (!values) { toast('请输入完整、有效且不小于 0 的标准'); return; }
    state.thresholds = values;
    const saved = writeSetting('amz-threshold', values);
    render();
    toast(saved ? '诊断标准已保存，报告已更新' : '报告已更新；浏览器不允许保存，仅本次有效');
  }
  if (event.target.id === 'frequency-form') {
    state.frequency = new FormData(event.target).get('frequency');
    toast(writeSetting('amz-frequency', state.frequency) ? '演示设置已保存，不会触发实际同步' : '浏览器不允许保存，此设置仅本次有效');
  }
});

function exportCsv() {
  const filtered = filterRows(rows, state.filters);
  if (!filtered.length) return;
  let header, body;
  if (state.page === 2) {
    header = ['广告类型', '类型说明', '花费 USD', '占比 %'];
    body = AD_TYPES.map(type => [type.name, type.label, aggregate(filtered).adSpend * type.share, type.share * 100]);
  } else {
    const detail = state.page !== 1;
    const keys = detail ? PRODUCT_KEYS : DETAIL_KEYS;
    let groups = detail ? matchingProducts(filtered, state.page === 3 ? state.query : '') : groupRows(filtered, dimensionKey(state));
    if (state.page === 4) groups = groups.filter(row => flags(row, state.thresholds).length);
    header = ['维度', ...(detail ? ['商品名', 'ASIN', '店铺'] : []), ...keys, ...(detail ? ['异常判断'] : [])];
    body = groups.map(row => [row.name, ...(detail ? [row.raw[0].category3, row.raw[0].asin, row.raw[0].shop] : []), ...keys.map(key => metrics(row)[key]), ...(detail ? [flags(row, state.thresholds).join('、') || '正常'] : [])]);
  }
  const period = periodFor(state.filters);
  const scope = [`日期=${period.start}至${DATA_END}`, `国家=${state.filters.country}`, `店铺=${state.filters.shop}`, `品类=${state.filters.category}`, `身份=${state.filters.role}`, '全部为虚构模拟数据；金额 USD；比例单位 %'];
  const blob = new Blob([toCsv([scope, header, ...body])], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `亚马逊看板-${PAGES[state.page]}-${period.start}-${period.end}.csv`;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('CSV 已导出，金额为 USD，比例为百分数');
}
$('export').addEventListener('click', exportCsv);
render();

});
</script>

    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div>AMAZON<small>经营驾驶舱</small></div></div>
      <p class="sidebar-caption">团队销售分析 · DEMO V1</p>
      <nav id="nav" aria-label="主要导航"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span> 演示环境<small>数据截止 2026.11.10</small></div>
    </aside>
    <main>
      <header class="top">
        <div><p class="breadcrumb">团队经营 / <span id="crumb">业绩总览</span></p><h1 id="title">业绩总览</h1><p class="subtitle" id="period"></p></div>
        <div class="top-actions"><span class="badge">● 虚构模拟数据</span><button id="export" type="button">↓ 导出 CSV</button></div>
      </header>
      <section class="filters" aria-label="数据筛选">
        <label>时间<select id="days"><option value="7">最近7天</option><option value="30" selected>最近30天</option><option value="month">本月累计</option></select></label>

        <label>店铺<select id="shop"></select></label>

    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
